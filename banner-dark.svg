<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-label="new-tonAA — Computer Vision / Game Development / Real-Time Rendering">
  <title>new-tonAA</title>
  <defs>
    <radialGradient id="avBg" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#1d3550"/>
      <stop offset="1" stop-color="#0e2138"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6b4638"/>
      <stop offset="1" stop-color="#3d241b"/>
    </linearGradient>
    <clipPath id="avClip"><circle cx="190" cy="200" r="104"/></clipPath>
    <clipPath id="nameClip">
      <rect x="360" y="96" width="700" height="110">
        <animate attributeName="width" from="0" to="700" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.6 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .fade { opacity: 1; animation: fadeUp 0.9s cubic-bezier(.2,.7,.25,1) backwards; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.55s; }
    .d4 { animation-delay: 0.75s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

    .spin  { animation: spin 38s linear infinite;  transform-origin: 190px 200px; }
    .spin2 { animation: spin 26s linear infinite reverse; transform-origin: 190px 200px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.5s 0.9s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .march { stroke-dasharray: 7 9; animation: march 14s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -320; } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .float, .spin, .spin2, .draw, .march { animation: none !important; opacity: 1; stroke-dashoffset: 0; }
      .march { stroke-dasharray: none; }
    }
  </style>

  <!-- right ornament: wireframe cube -->
  <g opacity="0.30" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path class="march" d="M 1390,62 L 1466,106 L 1466,194 L 1390,238 L 1314,194 L 1314,106 Z"/>
    <path class="march" d="M 1390,150 L 1466,106 M 1390,150 L 1390,238 M 1390,150 L 1314,106"/>
    <circle cx="1390" cy="62" r="4" fill="#60a5fa" stroke="none"/>
    <circle cx="1466" cy="106" r="4" fill="#60a5fa" stroke="none"/>
    <circle cx="1466" cy="194" r="4" fill="#60a5fa" stroke="none"/>
    <circle cx="1390" cy="238" r="4" fill="#60a5fa" stroke="none"/>
    <circle cx="1314" cy="194" r="4" fill="#60a5fa" stroke="none"/>
    <circle cx="1314" cy="106" r="4" fill="#60a5fa" stroke="none"/>
    <circle cx="1390" cy="150" r="4" fill="#60a5fa" stroke="none"/>
  </g>

  <!-- avatar (drawn around y=200, shifted up 40 to sit in the shorter frame) -->
  <g class="float">
    <g transform="translate(0,-50)">
      <circle cx="190" cy="200" r="134" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.14" class="spin2" stroke-dasharray="1 18"/>
      <circle cx="190" cy="200" r="121" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.40" stroke-dasharray="3 12" class="spin"/>
      <g class="spin"><circle cx="190" cy="79" r="4.5" fill="#60a5fa"/></g>
      <g class="spin2"><circle cx="190" cy="66" r="3" fill="#60a5fa" opacity="0.7"/></g>

      <g clip-path="url(#avClip)">
        <circle cx="190" cy="200" r="104" fill="url(#avBg)"/>
        <!-- back hair -->
        <path d="M 190,96 C 258,96 286,146 284,206 C 283,254 272,292 258,312 L 236,312 C 250,278 256,240 254,204 C 234,220 212,226 190,226 C 168,226 146,220 126,204 C 124,240 130,278 144,312 L 122,312 C 108,292 97,254 96,206 C 94,146 122,96 190,96 Z" fill="url(#hair)"/>
        <!-- shoulders / shirt -->
        <path d="M 84,306 C 96,258 130,240 190,240 C 250,240 284,258 296,306 Z" fill="#2b3d52"/>
        <!-- face -->
        <ellipse cx="190" cy="206" rx="52" ry="60" fill="#e9cbb6"/>
        <!-- neck -->
        <path d="M 170,236 L 210,236 L 210,268 Q 190,282 170,268 Z" fill="#e9cbb6"/>
        <!-- collar -->
        <path d="M 160,258 L 190,290 L 220,258" fill="none" stroke="#4b6483" stroke-width="3" stroke-linejoin="round"/>
        <!-- bangs -->
        <path d="M 137,178 C 132,140 158,120 190,120 C 222,120 248,140 243,178 C 236,158 222,146 206,142 C 216,156 220,168 219,178 C 210,158 200,150 190,150 C 180,150 170,158 161,178 C 160,168 164,156 174,142 C 158,146 144,158 137,178 Z" fill="url(#hair)"/>
        <!-- side locks -->
        <path d="M 122,168 C 108,206 110,258 120,302 C 126,302 132,298 134,292 C 124,252 122,206 130,174 Z" fill="url(#hair)" opacity="0.92"/>
        <path d="M 258,168 C 272,206 270,258 260,302 C 254,302 248,298 246,292 C 256,252 258,206 250,174 Z" fill="url(#hair)" opacity="0.92"/>
        <!-- hair highlights -->
        <path d="M 138,152 C 126,174 124,210 130,248" fill="none" stroke="#b9856a" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
        <path d="M 242,152 C 254,174 256,210 250,248" fill="none" stroke="#b9856a" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
        <!-- blush -->
        <ellipse cx="146" cy="228" rx="10" ry="5" fill="#c9857e" opacity="0.45"/>
        <ellipse cx="234" cy="228" rx="10" ry="5" fill="#c9857e" opacity="0.45"/>
        <!-- glasses -->
        <circle cx="168" cy="208" r="19" fill="#ffffff" fill-opacity="0.20" stroke="#c3d5e8" stroke-width="3.2"/>
        <circle cx="212" cy="208" r="19" fill="#ffffff" fill-opacity="0.20" stroke="#c3d5e8" stroke-width="3.2"/>
        <path d="M 187,205 Q 190,201 193,205" fill="none" stroke="#c3d5e8" stroke-width="3" stroke-linecap="round"/>
        <path d="M 149,204 L 133,198 M 231,204 L 247,198" fill="none" stroke="#c3d5e8" stroke-width="3" stroke-linecap="round"/>
        <!-- eyes + mouth -->
        <ellipse cx="168" cy="210" rx="3.6" ry="4.8" fill="#f2f6fb"/>
        <ellipse cx="212" cy="210" rx="3.6" ry="4.8" fill="#f2f6fb"/>
        <path d="M 184,236 Q 190,240 196,236" fill="none" stroke="#c9806f" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
      </g>
      <circle cx="190" cy="200" r="104" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.25"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text class="fade d1" x="360" y="86" font-size="60" font-weight="700" letter-spacing="2" fill="#f1f5f9">Hello</text>

    <g clip-path="url(#nameClip)">
      <text class="fade d2" x="360" y="161" font-size="64" font-weight="700" letter-spacing="1" fill="#f1f5f9">I&#8217;m <tspan fill="#60a5fa">new-tonAA</tspan></text>
    </g>

    <path class="draw" d="M 516,181 C 590,176 690,177 782,181" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <text class="fade d3" x="360" y="226" font-size="24" letter-spacing="2" fill="#93a4bb">Computer Vision / Game Development / Real-Time Rendering</text>

    <g class="fade d4" font-size="23" letter-spacing="1" fill="#cbd5e1">
      <path d="M 363,271 L 372,263 L 381,271 V 280 C 381,281.1 380.1,282 379,282 H 375 V 276 H 369 V 282 H 365 C 363.9,282 363,281.1 363,280 Z"
            fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="398" y="282">https://new-tonaa.github.io</text>
      <line x1="790" y1="260" x2="790" y2="289" stroke="#93a4bb" stroke-width="1.5" opacity="0.45"/>
      <g transform="translate(818,260)">
        <path d="M 12,1 C 5.9,1 1,5.9 1,12 C 1,16.9 4.2,21.1 8.6,22.5 C 9.2,22.6 9.4,22.3 9.4,21.9 L 9.4,20 C 6.3,20.7 5.6,18.6 5.6,18.6 C 5.1,17.2 4.3,16.9 4.3,16.9 C 3.2,16.2 4.3,16.2 4.3,16.2 C 5.5,16.3 6.1,17.4 6.1,17.4 C 7.2,19.3 9,18.8 9.5,18.4 C 9.6,17.6 10,17.1 10.4,16.8 C 7.9,16.5 5.3,15.6 5.3,11.4 C 5.3,10.2 5.7,9.2 6.1,8.4 C 6,8.1 5.6,7 6.2,5.3 C 6.2,5.3 7.2,5 9.4,6.5 C 10.4,6.2 11.4,6.1 12.4,6.1 C 13.4,6.1 14.4,6.2 15.4,6.5 C 17.6,5 18.6,5.3 18.6,5.3 C 19.2,7 18.8,8.1 18.7,8.4 C 19.1,9.2 19.5,10.2 19.5,11.4 C 19.5,15.6 16.9,16.5 14.4,16.8 C 14.9,17.2 15.3,17.9 15.3,19 L 15.3,21.9 C 15.3,22.3 15.5,22.6 16.1,22.5 C 20.5,21.1 23.7,16.9 23.7,12 C 23.7,5.9 18.8,1 12.7,1 Z" fill="#3b82f6"/>
      </g>
      <text x="858" y="282">@new-tonAA</text>
    </g>
  </g>
</svg>
