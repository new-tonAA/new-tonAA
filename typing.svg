<svg xmlns="http://www.w3.org/2000/svg" width="260" height="30" viewBox="0 0 260 30">
  <foreignObject width="260" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;">
      <style>
        .wrap {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          font-size: 20px;
          font-weight: 600;
          color: #24292f;
          display: inline-flex;
          align-items: center;
          height: 30px;
        }
        .text {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          border-right: 2px solid #24292f;
          width: 0;
          animation: typing 4s steps(9, end) infinite,
                     blink 0.8s step-end infinite;
        }
        @keyframes typing {
          0%   { width: 0; }
          40%  { width: 9ch; }
          60%  { width: 9ch; }
          100% { width: 0; }
        }
        @keyframes blink {
          0%, 100% { border-color: #24292f; }
          50%      { border-color: transparent; }
        }
        @media (prefers-color-scheme: dark) {
          .wrap, .text { color: #e6edf3; border-color: #e6edf3; }
          @keyframes blink {
            0%, 100% { border-color: #e6edf3; }
            50%      { border-color: transparent; }
          }
        }
      </style>
      <div class="wrap">
        <span class="text">I am a...</span>
      </div>
    </div>
  </foreignObject>
</svg>
